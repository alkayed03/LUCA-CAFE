<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>كاشير لوكا - النقاط</title><link rel="icon" href="images/luca-logo.png">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b1d14;--mut:#7a6a5d;--line:#e6dccf;--brand:#5b3a24;--acc:#b8672f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.c{max-width:460px;margin:2vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}h1{font-size:20px;text-align:center;margin:0 0 12px}
input{width:100%;padding:11px;margin:6px 0;border:1px solid var(--line);border-radius:10px;font:inherit;direction:ltr;text-align:right}
button{width:100%;border:0;border-radius:10px;padding:11px;margin-top:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.g{background:none;color:var(--brand);border:1px solid var(--line)}button:disabled{opacity:.4}.hid{display:none}
#reader{width:100%;border-radius:12px;overflow:hidden}.err{color:#b3372c;font-size:14px;min-height:18px;margin-top:6px}
.cus{background:#efe3d3;border-radius:14px;padding:14px;text-align:center;margin:10px 0}.cus b{font-size:40px;color:var(--acc);display:block}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.box h3{margin:0 0 4px;font-size:15px}.pv{font-size:14px;color:var(--mut);min-height:20px}
.toast{position:fixed;inset-inline:16px;bottom:16px;max-width:440px;margin:auto;background:#2f7d4f;color:#fff;padding:12px;border-radius:12px;text-align:center}
</style></head><body>
<div class="c" id="login"><h1>كاشير لوكا - النقاط</h1><input id="em" type="email" placeholder="إيميل الأدمن"><input id="pw" type="password" placeholder="كلمة السر">
<button id="in">دخول</button><div class="err" id="le"></div></div>
<div class="c hid" id="app"><h1>مسح كود الزبون</h1>
<div id="reader"></div><button class="g" id="cam">تشغيل الكاميرا</button>
<input id="ph" type="tel" placeholder="أو اكتب رقم موبايل الزبون"><button class="g" id="find">بحث بالرقم</button><div class="err" id="err"></div>
<div id="cus" class="hid"><div class="cus"><div id="cn" style="font-weight:700"></div><small id="cp"></small><b id="cpts"></b>نقطة</div>
<div class="box"><h3>مشتريات جديدة</h3><input id="amt" type="number" step="0.01" min="0" placeholder="المبلغ بالدينار"><div class="pv" id="pa"></div><button id="add" disabled>إضافة النقاط</button></div>
<div class="box"><h3>استبدال نقاط بخصم</h3><input id="red" type="number" step="20" min="0" placeholder="عدد النقاط (مضاعفات 20)"><div class="pv" id="pr"></div><button id="use" disabled>تأكيد الخصم</button></div>
<button class="g" id="next">زبون جديد</button></div><button class="g" id="out" style="margin-top:20px">تسجيل خروج</button></div>
<div class="toast hid" id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,collection,query,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAbfu5_nrZ2E_06eNYeYk7RL0SwLtzhCTk",authDomain:"luca-cafe.firebaseapp.com",projectId:"luca-cafe",appId:"1:576729730989:web:80ea8d4395c1de91189b24"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
/* === الإعدادات: غيّرها حسب رغبتك === */
const POINTS_PER_JD=1;        // كل دينار = 1 نقطة
const PTS_PER_DISCOUNT_JD=20; // كل 20 نقطة = 1 دينار خصم (لازم يطابق صفحة الزبون)
let uid=null,cur=0,scanner=null,busy=false;
const toast=m=>{const t=$("#t");t.textContent=m;t.classList.remove("hid");setTimeout(()=>t.classList.add("hid"),3500)};
const norm=p=>{p=p.replace(/\D/g,"");if(p.startsWith("00"))p=p.slice(2);if(p.startsWith("0"))p="962"+p.slice(1);return p};
$("#in").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}catch{$("#le").textContent="الإيميل أو كلمة السر غلط"}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("#login").classList.toggle("hid",!!u);$("#app").classList.toggle("hid",!u)});
async function startCam(){try{if(!scanner)scanner=new Html5Qrcode("reader");
 await scanner.start({facingMode:"environment"},{fps:10,qrbox:240},t=>{if(t.startsWith("LUCA:"))load(t.slice(5))});$("#cam").classList.add("hid")}catch{$("#err").textContent="ما اشتغلت الكاميرا، اسمح بالوصول أو ابحث بالرقم"}}
$("#cam").onclick=startCam;
async function load(id){if(busy)return;busy=true;$("#err").textContent="";
 try{const s=await getDoc(doc(db,"customers",id));if(!s.exists()){$("#err").textContent="الكود مش معروف";return}show(id,s.data())}
 catch{$("#err").textContent="ما قدرت أقرأ الحساب (تأكد إنك داخل بإيميل الأدمن)"}finally{busy=false}}
function show(id,d){uid=id;cur=d.points;if(scanner&&scanner.isScanning)scanner.stop().then(()=>$("#cam").classList.remove("hid")).catch(()=>{});
 $("#reader").classList.add("hid");$("#cus").classList.remove("hid");$("#cn").textContent=d.name;$("#cp").textContent="0"+d.phone.slice(3);$("#cpts").textContent=d.points;calc()}
$("#find").onclick=async()=>{$("#err").textContent="";const p=norm($("#ph").value);
 try{const s=await getDocs(query(collection(db,"customers"),where("phone","==",p)));if(s.empty)$("#err").textContent="ما لقيت زبون بهالرقم";else show(s.docs[0].id,s.docs[0].data())}catch{$("#err").textContent="خطأ بالبحث"}};
function calc(){const a=parseFloat($("#amt").value)||0,pts=Math.floor(a*POINTS_PER_JD);$("#pa").textContent=a>0?`راح تنضاف ${pts} نقطة`:"";$("#add").disabled=pts<1;
 const r=parseInt($("#red").value)||0,ok=r>0&&r%PTS_PER_DISCOUNT_JD===0&&r<=cur;$("#pr").textContent=r>0?(ok?`خصم ${r/PTS_PER_DISCOUNT_JD} دينار`:r>cur?"النقاط أكثر من رصيد الزبون":`لازم مضاعفات ${PTS_PER_DISCOUNT_JD}`):`الحد الأقصى: ${Math.floor(cur/PTS_PER_DISCOUNT_JD)*PTS_PER_DISCOUNT_JD} نقطة`;$("#use").disabled=!ok}
$("#amt").oninput=calc;$("#red").oninput=calc;
async function apply(delta,extra){const ref=doc(db,"customers",uid);
 try{const n=await runTransaction(db,async tx=>{const s=await tx.get(ref),p=s.data().points+delta;if(p<0)throw new Error("neg");
  tx.update(ref,{points:p});tx.set(doc(collection(db,"customers",uid,"log")),{points:delta,at:serverTimestamp(),by:auth.currentUser.email,...extra});return p});
  cur=n;$("#cpts").textContent=n;$("#amt").value="";$("#red").value="";calc();toast("تمت العملية ✓ الرصيد الجديد: "+n)}
 catch{$("#err").textContent="فشلت العملية، جرب مرة ثانية"}}
$("#add").onclick=()=>{const a=parseFloat($("#amt").value),p=Math.floor(a*POINTS_PER_JD);apply(p,{type:"earn",amount:a})};
$("#use").onclick=()=>{const r=parseInt($("#red").value);apply(-r,{type:"redeem",discount:r/PTS_PER_DISCOUNT_JD})};
$("#next").onclick=()=>{uid=null;$("#cus").classList.add("hid");$("#reader").classList.remove("hid");$("#ph").value="";startCam()};
</script></body></html>
