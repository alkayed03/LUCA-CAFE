    <script type="module">
      (async () => {
        try {
          const FB = "https://firestore.googleapis.com/v1/projects/luca-cafe/databases/(default)/documents/";
          const KEY = "AIzaSyAbfu5_nrZ2E_06eNYeYk7RL0SwLtzhCTk";
          let d = null;
          try {
            const fr = await fetch(FB + "site/menu?key=" + KEY, { cache: "no-store" });
            if (fr.ok) d = JSON.parse((await fr.json()).fields.json.stringValue);
          } catch (e) {}
          if (!d) {
            const r = await fetch("menu.json?v=" + Date.now(), { cache: "no-store" });
            if (r.ok) d = await r.json();
          }
          const imgs = {};
          if (d) {
            const ids = new Set();
            (d.categories || []).forEach((c) => (c.items || []).forEach((i) => { if (String(i.image || "").startsWith("fb:")) ids.add(i.image); }));
            await Promise.all([...ids].map(async (p) => {
              try {
                const ir = await fetch(FB + "images/" + encodeURIComponent(p.slice(3)) + "?key=" + KEY);
                if (ir.ok) imgs[p] = (await ir.json()).fields.data.stringValue;
              } catch (e) {}
            }));
          }
          if (d) {
            const cats = (d.categories || [])
              .filter((c) => !c.hidden)
              .map((c) => ({
                name: c.name,
                items: (c.items || [])
                  .filter((i) => !i.hidden)
                  .map((i) => ({
                    id: String(i.id),
                    name: i.name || "",
                    subtitle: i.subtitle || "",
                    price: Number(i.price) || 0,
                    description: i.description || "",
                    image: imgs[i.image] || i.image || "",
                    category: c.name,
                    searchText: ((i.name || "") + " " + (i.subtitle || "") + " " + (i.keywords || "")).toLowerCase(),
                  })),
              }))
              .filter((c) => c.items.length > 0);
            if (cats.length) window.__MENU__ = cats;
            const st = {};
            Object.entries(d.settings || {}).forEach(([k, v]) => { if (v) st[k] = v; });
            window.__SETTINGS__ = st;
          }
        } catch (e) { console.warn("menu.json not loaded, using built-in menu", e); }
        await import("./assets/index-Mk2Ls9Qf.js");
      })();
    </script>
